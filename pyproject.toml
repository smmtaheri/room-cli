[project]
name = "room-cli"
version = "0.1.0"
description = "CLI tool for checking and booking meeting rooms via OWA"
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [{ name = "Mohammad Taheri", email = "admirer135@gmail.com" }]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "google-api-python-client>=2.196.0,<3.0.0",
    "google-auth-oauthlib>=1.4.0,<2.0.0",
    "google-auth-httplib2>=0.4.0,<0.5.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
]

[tool.uv]
package = false
